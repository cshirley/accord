# Thin composite invoking `bun run packages/accord-ci/src/run-phase.ts` so the main
# workflow keeps its conditional branching readable. The script delegates to
# `accord-cli` (exec harness) and writes `status` to GITHUB_OUTPUT.

name: Run ACCORD phase
description: Invoke `accord <phase> <ticket> --harness exec` and emit the terminal phase status.

inputs:
  phase:
    description: ACCORD phase name (spec | plan | code | verify | resume | finish | gather | align | init).
    required: true
  ticket:
    description: Jira ticket key.
    required: true
  task_id:
    description: Optional task id (for the `code` and `verify` phases).
    required: false
    default: ""
  owner_nonce:
    description: Optional owner nonce (for the `code` and `verify` phases).
    required: false
    default: ""
  harness:
    description: accord-cli harness backend id (claude, cursor, pi).
    required: false
    default: claude

outputs:
  status:
    description: Final status from the phase return packet (done / needs_input / blocked / gaps / stuck).
    value: ${{ steps.runphase.outputs.status }}

runs:
  using: composite
  steps:
    - name: Run phase via accord-ci run-phase.ts
      id: runphase
      shell: bash
      working-directory: .accord-ci
      env:
        ACCORD_CI_HARNESS: ${{ inputs.harness }}
      run: |
        EXTRA_ARGS=()
        if [ -n "${{ inputs.task_id }}" ]; then
          EXTRA_ARGS+=("--task-id=${{ inputs.task_id }}")
        fi
        if [ -n "${{ inputs.owner_nonce }}" ]; then
          EXTRA_ARGS+=("--owner-nonce=${{ inputs.owner_nonce }}")
        fi
        bun run packages/accord-ci/src/run-phase.ts --phase "${{ inputs.phase }}" --ticket "${{ inputs.ticket }}" "${EXTRA_ARGS[@]}"
