# AC-12 + AC-13: pi-coding-agent + pi-accord installer + cache surface.
#
# Caches: node_modules, bun caches, ~/.config/pi/agent (minus auth.json and
# sessions/**). The cache key is pinned literally — `tests/ci/setup-pi-cache.test.ts`
# enforces every string verbatim per the AC-12 contract.
#
# Defence-in-depth (AC-13): a step with `if: always()` deletes
# ~/.config/pi/agent/auth.json BEFORE the cache save step so a credential
# never lands inside the published cache artifact, regardless of whether the
# cache step ran to completion.
#
# Runtime seed configs: pi-subagent reads `subagent.json` and
# pi-thrift reads `thrift.json` from the Pi agent directory. Neither file
# exists on a fresh runner. The "Seed runtime configs" step below copies
# CI-tuned templates from `assets/ci/` into the agent directory using
# `cp -n` (no-clobber) so a restored cache version always wins.
#
# pi-thrift hard-codes `homedir()/.pi/agent` whereas pi-coding-agent on
# Linux uses `~/.config/pi/agent`. We make `~/.pi` a symlink to
# `~/.config/pi` so both modules end up reading and writing the same
# directory (matches the local-developer layout on macOS).

name: Setup pi + ACCORD
description: Install pi-coding-agent + pi-accord with cache-friendly layout (AC-12 / AC-13).

inputs:
  pi_version:
    description: npm tag or version of @earendil-works/pi-coding-agent.
    required: false
    default: latest
  accord_ref:
    description: Tag/branch of pi-accord asset bundle to install.
    required: false
    default: v1
  subagent_profile:
    description: |
      Profile name to mark as activeProfile inside ~/.config/pi/agent/subagent.json.
      Applied after the seed copy step (or to whatever consumer config is in the cache),
      via jq.  Defaults to the only profile shipped in the bundled CI template.
    required: false
    default: anthropic-direct

runs:
  using: composite
  steps:
    - name: Checkout pi-accord into .accord-ci/
      uses: actions/checkout@v4
      with:
        repository: cshirley/accord
        ref: ${{ inputs.accord_ref }}
        path: .accord-ci

    - name: Install Bun
      uses: oven-sh/setup-bun@v2
      with:
        bun-version: latest

    - name: Scrub stale auth.json before cache save (AC-13)
      if: ${{ always() }}
      shell: bash
      run: rm -f ~/.config/pi/agent/auth.json

    - name: Cache pi + accord install (AC-12 + AC-13)
      uses: actions/cache@v4
      with:
        key: accord-${{ runner.os }}-${{ inputs.pi_version }}-${{ inputs.accord_ref }}-${{ hashFiles('.accord-ci/bun.lock', '.accord-ci/assets/manifest.json') }}
        restore-keys: |
          accord-${{ runner.os }}-${{ inputs.pi_version }}-${{ inputs.accord_ref }}-
          accord-${{ runner.os }}-${{ inputs.pi_version }}-
        path: |
          ~/.npm
          ~/.bun/install/cache
          ~/.config/pi/agent
          .accord-ci/node_modules
          !~/.config/pi/agent/auth.json
          !~/.config/pi/agent/sessions/**

    - name: Install pi-coding-agent
      shell: bash
      env:
        PI_OFFLINE: "1"
        PI_SKIP_VERSION_CHECK: "1"
      run: |
        npm i -g @earendil-works/pi-coding-agent@${{ inputs.pi_version }}

    - name: bun install (in .accord-ci/)
      shell: bash
      working-directory: .accord-ci
      env:
        PI_OFFLINE: "1"
      run: bun install --frozen-lockfile

    - name: pi install pi-accord
      shell: bash
      working-directory: .accord-ci
      env:
        PI_OFFLINE: "1"
        PI_SKIP_VERSION_CHECK: "1"
      run: |
        pi install $(pwd)
        bun run install:assets

    - name: Seed runtime configs for pi-subagent and pi-thrift
      shell: bash
      env:
        SUBAGENT_PROFILE: ${{ inputs.subagent_profile }}
      run: |
        set -euo pipefail
        # Ensure pi-thrift's `homedir()/.pi/agent` path resolves to the same
        # directory pi-coding-agent uses on Linux (`~/.config/pi/agent`),
        # mirroring the local-developer layout on macOS.
        mkdir -p "$HOME/.config/pi"
        if [ ! -e "$HOME/.pi" ]; then
          ln -s "$HOME/.config/pi" "$HOME/.pi"
        fi
        mkdir -p "$HOME/.config/pi/agent"

        SUBAGENT_DST="$HOME/.config/pi/agent/subagent.json"
        THRIFT_DST="$HOME/.config/pi/agent/thrift.json"

        # Seed CI-tuned configs only if they don't already exist (cache wins).
        cp -n .accord-ci/assets/ci/subagent.json "$SUBAGENT_DST" || true
        cp -n .accord-ci/assets/ci/thrift.json   "$THRIFT_DST"   || true

        # Apply the requested activeProfile. We fail fast if the named profile
        # is not present in the resulting JSON — better than letting pi-subagent
        # silently fall back to in-code defaults at the first phase invocation.
        if [ -f "$SUBAGENT_DST" ]; then
          if ! command -v jq >/dev/null 2>&1; then
            echo "::error::jq is required to apply subagent_profile but was not found on the runner."
            exit 1
          fi
          if ! jq -e --arg p "$SUBAGENT_PROFILE" '.profiles[$p]' "$SUBAGENT_DST" >/dev/null; then
            echo "::error::subagent_profile '$SUBAGENT_PROFILE' is not defined in $SUBAGENT_DST. Available profiles:"
            jq -r '.profiles | keys[]' "$SUBAGENT_DST" || true
            exit 1
          fi
          tmp="$(mktemp)"
          jq --arg p "$SUBAGENT_PROFILE" '.activeProfile = $p' "$SUBAGENT_DST" > "$tmp"
          mv "$tmp" "$SUBAGENT_DST"
          echo "Set activeProfile to '$SUBAGENT_PROFILE' in $SUBAGENT_DST"
        fi

        echo "::group::Seeded pi agent dir"
        ls -la "$HOME/.config/pi/agent/"
        echo "::endgroup::"

    - name: Export PI flags to subsequent steps
      shell: bash
      run: |
        echo "PI_OFFLINE=1" >> "$GITHUB_ENV"
        echo "PI_SKIP_VERSION_CHECK=1" >> "$GITHUB_ENV"
