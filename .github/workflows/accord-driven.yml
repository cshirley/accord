# CI-driven mode: a push to accord/<ID>/** that adds only docs/dev/<ID>/brief.md and
# spec.json (with stack.enabled true) makes CI build PR0 (plan.json + stack table).
# Local stack branches use stack/<ID>/pr-<n> and never trigger this workflow.
# After PR0 merges, the resume job continues the work item: a push to main that touches
# docs/dev/<ID>/contract.lock.json, or an authorised gate comment (/accord approve,
# /accord unblock) on a work item PR. Both triggers sit behind the same stack.enabled check.

name: ACCORD driven

on:
  push:
    branches:
      - "accord/*/**"
      - "main"
  issue_comment:
    types: [created]

permissions:
  contents: read

jobs:
  pr0:
    name: accord/driven PR0
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Gate (Dev Harness stack.enabled and brief.md + spec.json only)
        id: gate
        env:
          ACCORD_CI_BASE_REF: ${{ github.event.repository.default_branch }}
        run: |
          # Ends the job green unless stack.enabled is true and only brief.md + spec.json were added.
          bun packages/accord-ci/src/ci-driven/gate.ts

      - name: Install dependencies
        if: steps.gate.outputs.run == 'true'
        run: bun install --frozen-lockfile

      - name: Git identity
        if: steps.gate.outputs.run == 'true'
        run: |
          git config --global user.name "accord-ci"
          git config --global user.email "accord-ci@users.noreply.github.com"

      - name: Build PR0
        if: steps.gate.outputs.run == 'true'
        env:
          ACCORD_CI_PUSH_TOKEN: ${{ secrets.ACCORD_CI_PUSH_TOKEN }}
          ACCORD_CI_BASE_REF: ${{ github.event.repository.default_branch }}
          ACCORD_CI_HARNESS: claude
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: bun packages/accord-ci/src/ci-driven/pr0.ts

  resume-gate:
    name: accord/driven resume gate
    if: github.event_name == 'push' && github.ref_name == 'main' || (github.event_name == 'issue_comment' && github.event.issue.pull_request && startsWith(github.event.comment.body, '/accord '))
    permissions:
      contents: read
      pull-requests: read
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      run: ${{ steps.resume_gate.outputs.run }}
      work_item_id: ${{ steps.resume_gate.outputs.work_item_id }}
      ref: ${{ steps.resume_gate.outputs.ref }}
      pr: ${{ steps.resume_gate.outputs.pr }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Gate (Dev Harness stack.enabled, committed state, push to main or gate comment)
        id: resume_gate
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Ends the job green unless stack.enabled is true, the work item has committed state,
          # and the event is a contract.lock.json push to main or an authorised gate comment.
          bun packages/accord-ci/src/ci-driven/resume-gate.ts

  resume:
    name: accord/driven resume
    needs: resume-gate
    if: needs.resume-gate.outputs.run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    concurrency:
      group: accord-${{ needs.resume-gate.outputs.work_item_id }}
      cancel-in-progress: false
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.resume-gate.outputs.ref || github.ref_name }}
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Git identity
        run: |
          git config --global user.name "accord-ci"
          git config --global user.email "accord-ci@users.noreply.github.com"

      - name: Resume work item
        env:
          ACCORD_CI_PUSH_TOKEN: ${{ secrets.ACCORD_CI_PUSH_TOKEN }}
          ACCORD_CI_WORK_ITEM_ID: ${{ needs.resume-gate.outputs.work_item_id }}
          ACCORD_CI_PR_NUMBER: ${{ needs.resume-gate.outputs.pr }}
          ACCORD_CI_HARNESS: claude
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: bun packages/accord-ci/src/ci-driven/resume.ts
