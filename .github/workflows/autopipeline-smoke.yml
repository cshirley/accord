# Smoke wrapper for the reusable autopipeline.
#
# Used by maintainers to fire the autopipeline against a dummy ticket from
# `gh workflow run`. NOT for consumers — consumers use
# examples/consumer-repo/.github/workflows/jira-autopipeline.yml as a
# starting point.
#
# Default is dry_run=true so this never touches a real Jira/GitHub side
# effect unless explicitly overridden.

name: Autopipeline smoke (maintainer-only)

on:
  workflow_dispatch:
    inputs:
      ticket:
        description: Dummy Jira-style key for the smoke (e.g. DEMO-1).
        required: true
        type: string
        default: DEMO-1
      base_branch:
        description: |
          Branch the autopipeline branches from. For pre-merge smoke runs
          this should be the feature branch that actually contains
          .github/actions/setup-pi/ (e.g. ticket-to-pr-feature). After
          this work is merged the default `main` is correct.
        required: false
        type: string
        default: main
      accord_ref:
        description: |
          Ref of pi-accord assets to install. The maintainer-only smoke
          wrapper defaults to `main` so it always works against the
          current default branch. Consumer wrappers should pin to a
          tagged release (e.g. `v1`) once one exists on origin.
        required: false
        type: string
        default: main
      dry_run:
        description: Skip all side effects (git push, PR open, Jira comment/transition).
        required: false
        type: boolean
        default: true
      max_cost_usd:
        description: Cost cap. Keep low for smoke runs.
        required: false
        type: number
        default: 1

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  smoke:
    uses: ./.github/workflows/autopipeline.yml
    with:
      ticket: ${{ inputs.ticket }}
      base_branch: ${{ inputs.base_branch }}
      accord_ref: ${{ inputs.accord_ref }}
      # `workflow_dispatch` inputs declared as `type: boolean`/`type: number`
      # arrive at the caller as JSON-encoded strings ("true"/"1") and the
      # reusable workflow's input type check rejects them. fromJSON re-parses
      # them into the actual boolean/number the called workflow expects.
      # See actions/runner#1483.
      dry_run: ${{ fromJSON(inputs.dry_run) }}
      max_cost_usd: ${{ fromJSON(inputs.max_cost_usd) }}
    secrets: inherit
